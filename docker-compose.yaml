services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5059:5059"
    environment:
      - DB_URL=${DB_URL}
      - XAI_API_KEY=${XAI_API_KEY}
    labels:
      - coolify.managed=true
      - coolify.port=5059
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:5059/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
