name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fastvc
          POSTGRES_PASSWORD: fastvc
          POSTGRES_DB: fastvc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fastvc"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: postgresql://fastvc:fastvc@localhost:5432/fastvc
      XAI_API_KEY: test-key-not-used-in-smoke

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: python -m db.migrate

      - name: Seed test data
        run: python -m synthetic.generate --seed 42 --limit 5 --skip-rag

      - name: Import check
        run: python -c "from app import app; from chat import routes, pipeline, instructions, analytics, companies, memo_pdf, exports, dataroom, help, valuation, webhooks, integrations, news_sources, training, investors, portfolio, discovery; from auth import routes as _auth; print('OK')"

      - name: Smoke tests
        run: pytest -q tests/test_agents_smoke.py tests/test_company_ingestion.py -k "not test_rag_retrieval"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          test -n "$COOLIFY_WEBHOOK_URL"
          test -n "$COOLIFY_TOKEN"
          curl --fail --show-error --silent --retry 3 \
            "$COOLIFY_WEBHOOK_URL" \
            -H "Authorization: Bearer $COOLIFY_TOKEN"
